<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}出游账本{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-inner">
            {% if trip_id %}
            <button class="nav-back" onclick="goBack()" id="backBtn">← 返回</button>
            {% else %}
            <a href="/" style="text-decoration:none;color:var(--text);">
                <span class="nav-brand">🧾 出游账本</span>
            </a>
            {% endif %}
            <span class="nav-title" id="navTitle">{% block nav_title %}{% endblock %}</span>
            <div class="nav-right" id="navRight">
                <div id="userNav" class="user-nav"></div>
                {% block nav_right %}{% endblock %}
            </div>
        </div>
    </nav>
    
    <main class="main-content has-nav">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
    // 检查登录状态，渲染用户导航
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/me')
            .then(r => r.json())
            .then(data => {
                const nav = document.getElementById('userNav');
                if (data.ok) {
                    const u = data.user;
                    const displayName = u.nickname || u.username;
                    const initial = displayName[0];
                    let avatarHtml = `<span class="user-avatar-sm">${initial}</span>`;
                    if (u.avatar_url) {
                        avatarHtml = `<span class="user-avatar-sm" style="background:none;overflow:hidden;"><img src="${u.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.style.display='none'"></span>`;
                    }
                    nav.innerHTML = `
                        <a href="/profile" class="user-nav-link">
                            ${avatarHtml}
                            <span class="user-nav-name">${displayName}</span>
                        </a>
                    `;
                } else {
                    nav.innerHTML = `<button class="nav-login-btn" onclick="window.location='/'">登录</button>`;
                }
            })
            .catch(() => {});
    });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
