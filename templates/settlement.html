{% extends "base.html" %}
{% block title %}结算{% endblock %}
{% block nav_title %}结算与对账{% endblock %}

{% block content %}
<div class="settle-page" data-trip-id="{{ trip_id }}">

    <!-- 总览卡片 -->
    <div id="settleSummary" class="settle-summary">
        <div class="loading-text">加载结算数据...</div>
    </div>

    <!-- 费用类型：自付 vs 分摊 -->
    <div class="section">
        <div class="section-header">
            <h3>🧾 费用类型</h3>
        </div>
        <div id="splitTypeDetail" class="split-type-detail">
            <div class="loading-text">加载中...</div>
        </div>
    </div>

    <!-- 分类统计 -->
    <div class="section">
        <div class="section-header">
            <h3>📊 分类统计</h3>
        </div>
        <div id="categoryDetail" class="category-detail-list">
            <div class="loading-text">加载中...</div>
        </div>
    </div>

    <!-- 收支平衡 -->
    <div class="section">
        <div class="section-header">
            <h3>💰 收支平衡</h3>
        </div>
        <div id="balanceList" class="balance-list">
            <div class="loading-text">加载中...</div>
        </div>
    </div>

    <!-- 结算方案 -->
    <div class="section">
        <div class="section-header">
            <h3>🤝 结算方案</h3>
            <button class="btn-sm" onclick="generateScreenshot()">📸 截图分享</button>
        </div>
        <div id="settlementList" class="settlement-list">
            <div class="loading-text">加载中...</div>
        </div>
    </div>

    <!-- 成员支出明细 -->
    <div class="section">
        <div class="section-header">
            <h3>📝 成员支出明细</h3>
        </div>
        <div id="memberDetail" class="member-detail-list">
            <div class="loading-text">加载中...</div>
        </div>
    </div>

    <!-- 结算历史 -->
    <div class="section">
        <div class="section-header">
            <h3>📋 结算记录</h3>
            <button class="btn-sm" onclick="saveSettlement()">💾 保存本次结算</button>
        </div>
        <div id="settlementHistory" class="settlement-history">
            <div class="loading-text">加载中...</div>
        </div>
    </div>

    <!-- 截图预览弹窗 -->
    <div id="screenshotModal" class="modal" style="display:none;">
        <div class="modal-backdrop" onclick="closeScreenshotModal()"></div>
        <div class="modal-content screenshot-modal-content">
            <div id="screenshotPreview" class="screenshot-preview">
                <!-- 截图内容 -->
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="downloadScreenshot()">📥 保存截图</button>
                <button class="btn btn-secondary" onclick="closeScreenshotModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 结算历史详情弹窗 -->
    <div id="historyDetailModal" class="modal" style="display:none;">
        <div class="modal-backdrop" onclick="closeHistoryDetailModal()"></div>
        <div class="modal-content">
            <h3 id="historyDetailTitle">结算详情</h3>
            <div id="historyDetailBody" class="history-detail-body"></div>
            <div class="modal-actions" style="flex-direction:column;gap:10px;margin-top:16px;">
                <button class="btn btn-danger btn-full" onclick="deleteHistoryRecord()">🗑️ 删除此记录</button>
                <button class="btn btn-secondary btn-full" onclick="closeHistoryDetailModal()">关闭</button>
            </div>
        </div>
    </div>

</div>

<script>
let currentTripId = {{ trip_id }};
let settlementData = null;

document.addEventListener('DOMContentLoaded', function() {
    loadSettlement();
    loadHistory();
});

async function loadSettlement() {
    try {
        const res = await fetch(`/api/trip/${currentTripId}/settlement`);
        const data = await res.json();
        if (!data.ok) { showToast('加载失败'); return; }
        
        settlementData = data;
        renderSummary(data);
        renderSplitType(data);
        renderCategoryDetail(data);
        renderBalances(data);
        renderSettlements(data);
        renderMemberDetail(data);
    } catch(e) {
        showToast('加载结算数据失败');
    }
}

function renderSummary(data) {
    document.getElementById('settleSummary').innerHTML = `
        <div class="summary-grid">
            <div class="summary-item">
                <span class="summary-label">总花费</span>
                <span class="summary-value primary">¥${data.total.toFixed(2)}</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">参与人数</span>
                <span class="summary-value">${data.member_count}人</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">人均</span>
                <span class="summary-value">¥${data.per_person.toFixed(2)}</span>
            </div>
        </div>
    `;
}

function renderSplitType(data) {
    const selfTotal = data.self_paid_total || 0;
    const splitTotal = data.split_total || 0;
    const grandTotal = selfTotal + splitTotal;
    const container = document.getElementById('splitTypeDetail');
    
    if (grandTotal === 0) {
        container.innerHTML = '<div class="empty-hint">暂无数据</div>';
        return;
    }
    
    const selfPct = grandTotal > 0 ? (selfTotal / grandTotal * 100) : 0;
    const splitPct = grandTotal > 0 ? (splitTotal / grandTotal * 100) : 0;
    
    container.innerHTML = `
        <div class="split-type-card">
            <div class="split-type-row">
                <div class="split-type-icon">🙋</div>
                <div class="split-type-info">
                    <div class="split-type-label">个人承担（自付）</div>
                    <div class="split-type-amount">¥${selfTotal.toFixed(2)}</div>
                </div>
                <div class="split-type-pct">${selfPct.toFixed(1)}%</div>
            </div>
            <div class="split-type-bar-track">
                <div class="split-type-bar self-bar" style="width:${selfPct}%"></div>
                <div class="split-type-bar split-bar" style="width:${splitPct}%;margin-left:${selfPct}%"></div>
            </div>
            <div class="split-type-row" style="margin-top:10px;">
                <div class="split-type-icon">👥</div>
                <div class="split-type-info">
                    <div class="split-type-label">集体分摊</div>
                    <div class="split-type-amount">¥${splitTotal.toFixed(2)}</div>
                </div>
                <div class="split-type-pct">${splitPct.toFixed(1)}%</div>
            </div>
        </div>
    `;
}

function renderCategoryDetail(data) {
    const cats = ['餐饮', '交通', '住宿', '门票', '购物', '酒水/娱乐', '其他'];
    const icons = {'餐饮':'🍽️','交通':'🚗','住宿':'🏠','门票':'🎫','购物':'🛍️','酒水/娱乐':'🍻','其他':'📌'};
    const container = document.getElementById('categoryDetail');
    
    if (Object.keys(data.category_totals).length === 0) {
        container.innerHTML = '<div class="empty-hint">暂无数据</div>';
        return;
    }
    
    const total = data.total;
    container.innerHTML = cats.map(cat => {
        const amount = data.category_totals[cat] || 0;
        const pct = total > 0 ? (amount / total * 100) : 0;
        if (amount === 0) return '';
        return `
            <div class="cat-detail-row">
                <div class="cat-detail-left">
                    <span class="cat-detail-icon">${icons[cat] || '📌'}</span>
                    <span class="cat-detail-name">${cat}</span>
                </div>
                <div class="cat-detail-right">
                    <div class="cat-detail-bar-track">
                        <div class="cat-detail-bar-fill" style="width:${pct}%"></div>
                    </div>
                    <span class="cat-detail-amount">¥${amount.toFixed(2)}</span>
                    <span class="cat-detail-pct">${pct.toFixed(1)}%</span>
                </div>
            </div>
        `;
    }).filter(Boolean).join('');
}

function renderBalances(data) {
    const container = document.getElementById('balanceList');
    const balances = Object.values(data.balances);
    
    container.innerHTML = balances.map(b => {
        const isPositive = b.balance > 0;
        const isZero = Math.abs(b.balance) < 0.01;
        return `
            <div class="balance-card ${isZero ? 'zero' : isPositive ? 'positive' : 'negative'}">
                <div class="balance-info">
                    <span class="balance-name">${b.name}</span>
                    <div class="balance-detail">
                        <span>付了 ¥${b.paid.toFixed(2)}</span>
                        <span>· 应付 ¥${b.should_pay.toFixed(2)}</span>
                    </div>
                </div>
                <div class="balance-result">
                    ${isZero ? '✅ 平了' : isPositive ? `💰 应收 ¥${b.balance.toFixed(2)}` : `💸 应付 ¥${(-b.balance).toFixed(2)}`}
                </div>
            </div>
        `;
    }).join('');
}

function renderSettlements(data) {
    const container = document.getElementById('settlementList');
    
    if (data.settlements.length === 0) {
        const allZero = Object.values(data.balances).every(b => Math.abs(b.balance) < 0.01);
        container.innerHTML = allZero 
            ? '<div class="settle-done">🎉 账目已平，无需结算！</div>'
            : '<div class="empty-hint">无需结算</div>';
        return;
    }
    
    container.innerHTML = data.settlements.map(s => `
        <div class="settle-item">
            <span class="settle-from">${s.from_name}</span>
            <span class="settle-arrow">→ 💰 →</span>
            <span class="settle-to">${s.to_name}</span>
            <span class="settle-amount">¥${s.amount.toFixed(2)}</span>
        </div>
    `).join('');
}

function renderMemberDetail(data) {
    const container = document.getElementById('memberDetail');
    
    const memberExpenses = data.member_expenses;
    if (!memberExpenses || Object.keys(memberExpenses).length === 0) {
        container.innerHTML = '<div class="empty-hint">暂无数据</div>';
        return;
    }
    
    container.innerHTML = Object.entries(memberExpenses).map(([mid, m]) => {
        const total = m.expenses.reduce((s, e) => s + e.amount, 0);
        const catSummary = {};
        m.expenses.forEach(e => {
            catSummary[e.category] = (catSummary[e.category] || 0) + e.amount;
        });
        
        const catStr = Object.entries(catSummary)
            .map(([c, a]) => `${c}:¥${a.toFixed(2)}`)
            .join(' · ');
        
        return `
            <div class="member-detail-card">
                <div class="member-detail-header">
                    <span class="member-detail-name">${m.name}</span>
                    <span class="member-detail-total">总支出: ¥${total.toFixed(2)}</span>
                </div>
                ${catStr ? `<div class="member-detail-cats">${catStr}</div>` : ''}
                <div class="member-detail-split-summary">
                    <span class="self-badge">🙋 自付 ¥${(m.self_paid || 0).toFixed(2)}</span>
                    <span class="split-badge">👥 分摊 ¥${(m.split_amount || 0).toFixed(2)}</span>
                </div>
                <div class="member-detail-expenses">
                    ${m.expenses.map(e => `
                        <div class="member-expense-item">
                            <span class="expense-cat-tag">${e.category}</span>
                            <span class="expense-split-tag ${e.split_type === 'self' ? 'tag-self' : 'tag-split'}">${e.split_type === 'self' ? '🙋自付' : '👥分摊'}</span>
                            <span class="expense-note-text">${e.note || '（无备注）'}</span>
                            <span class="expense-amount-text">¥${e.amount.toFixed(2)}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }).join('');
}

// ── 截图生成 ──
function generateScreenshot() {
    if (!settlementData) return;
    
    const container = document.getElementById('screenshotPreview');
    const data = settlementData;
    const cats = ['餐饮', '交通', '住宿', '门票', '购物', '酒水/娱乐', '其他'];
    const icons = {'餐饮':'🍽️','交通':'🚗','住宿':'🏠','门票':'🎫','购物':'🛍️','酒水/娱乐':'🍻','其他':'📌'};
    
    let catBars = '';
    if (Object.keys(data.category_totals).length > 0) {
        const total = data.total;
        catBars = cats.map(cat => {
            const amt = data.category_totals[cat] || 0;
            const pct = total > 0 ? (amt / total * 100) : 0;
            if (amt === 0) return '';
            return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;">
                <span>${icons[cat] || '📌'} ${cat}</span>
                <span style="font-weight:600;">¥${amt.toFixed(2)} (${pct.toFixed(1)}%)</span>
            </div>`;
        }).filter(Boolean).join('');
    }
    
    let settleText = '';
    if (data.settlements.length > 0) {
        settleText = data.settlements.map(s => 
            `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee;">
                <span>${s.from_name} → ${s.to_name}</span>
                <span style="font-weight:700;color:#E74C3C;">¥${s.amount.toFixed(2)}</span>
            </div>`
        ).join('');
    } else {
        settleText = '<div style="text-align:center;color:#999;padding:12px;">🎉 账目已平，无需结算</div>';
    }
    
    container.innerHTML = `
        <div style="background:white;border-radius:16px;padding:24px;max-width:420px;margin:0 auto;font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#333;">
            <!-- Header -->
            <div style="text-align:center;margin-bottom:20px;">
                <div style="font-size:32px;margin-bottom:4px;">🧾</div>
                <div style="font-size:18px;font-weight:700;">行程账单</div>
                <div style="font-size:13px;color:#999;">${data.member_count}人 · 共${Object.values(data.member_expenses).reduce((s,m) => s + m.expenses.length, 0)}笔</div>
            </div>
            
            <!-- Total -->
            <div style="text-align:center;margin-bottom:20px;padding:16px;background:#F8F9FA;border-radius:12px;">
                <div style="font-size:13px;color:#666;">总花费</div>
                <div style="font-size:36px;font-weight:700;color:#007AFF;">¥${data.total.toFixed(2)}</div>
                <div style="font-size:13px;color:#999;">人均 ¥${data.per_person.toFixed(2)}</div>
            </div>
            
            <!-- Categories -->
            <div style="margin-bottom:16px;">
                <div style="font-size:14px;font-weight:600;margin-bottom:8px;">📊 分类统计</div>
                ${catBars}
            </div>
            
            <!-- 费用类型 -->
            <div style="margin-bottom:16px;">
                <div style="font-size:14px;font-weight:600;margin-bottom:8px;">🧾 费用类型</div>
                <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;">
                    <span>🙋 个人承担</span>
                    <span style="font-weight:600;">¥${(data.self_paid_total||0).toFixed(2)}</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;">
                    <span>👥 集体分摊</span>
                    <span style="font-weight:600;">¥${(data.split_total||0).toFixed(2)}</span>
                </div>
            </div>
            
            <!-- Settlement -->
            <div style="margin-bottom:16px;">
                <div style="font-size:14px;font-weight:600;margin-bottom:8px;">🤝 结算方案</div>
                ${settleText}
            </div>
            
            <!-- Footer -->
            <div style="text-align:center;font-size:11px;color:#ccc;margin-top:16px;padding-top:12px;border-top:1px solid #eee;">
                由「出游账本」自动生成
            </div>
        </div>
    `;
    
    document.getElementById('screenshotModal').style.display = 'flex';
}

async function downloadScreenshot() {
    const preview = document.getElementById('screenshotPreview');
    
    // 使用html2canvas
    if (typeof html2canvas !== 'undefined') {
        try {
            const canvas = await html2canvas(preview.firstElementChild, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false
            });
            
            const link = document.createElement('a');
            link.download = 'travel-bill.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('✅ 截图已保存');
        } catch(e) {
            // fallback: 直接复制内容
            fallbackCopy();
        }
    } else {
        // 如果没有html2canvas，用简单的转发方式
        showToast('正在加载截图库...');
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
        script.onload = () => setTimeout(downloadScreenshot, 500);
        document.head.appendChild(script);
    }
}

function fallbackCopy() {
    // 最简单的fallback - 复制文本到剪贴板
    if (!settlementData) return;
    let text = `🧾 行程账单\n`;
    text += `总花费: ¥${settlementData.total.toFixed(2)} | ${settlementData.member_count}人\n`;
    text += `人均: ¥${settlementData.per_person.toFixed(2)}\n\n`;
    text += `分类:\n`;
    for (const [cat, amt] of Object.entries(settlementData.category_totals)) {
        text += `  ${cat}: ¥${amt.toFixed(2)}\n`;
    }
    text += `\n结算:\n`;
    for (const s of settlementData.settlements) {
        text += `  ${s.from_name} → ${s.to_name}: ¥${s.amount.toFixed(2)}\n`;
    }
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            showToast('✅ 账单文本已复制到剪贴板');
        });
    } else {
        showToast('✅ 请手动截图保存');
    }
}

function closeScreenshotModal() {
    document.getElementById('screenshotModal').style.display = 'none';
}

// ── 结算记录 ──
let historyRecords = [];

async function saveSettlement() {
    const note = prompt('给这次结算加个备注（可选）：', `结算 ${new Date().toLocaleDateString()}`);
    if (note === null) return;
    
    try {
        const res = await fetch(`/api/trip/${currentTripId}/settlement/save`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({note: note || ''})
        });
        const data = await res.json();
        if (data.ok) {
            showToast('✅ 结算记录已保存');
            loadHistory();
        } else {
            showToast(data.error || '保存失败');
        }
    } catch(e) {
        showToast('网络错误');
    }
}

async function loadHistory() {
    try {
        const res = await fetch(`/api/trip/${currentTripId}/settlement/history`);
        const data = await res.json();
        const container = document.getElementById('settlementHistory');
        
        if (!data.ok || !data.records || data.records.length === 0) {
            container.innerHTML = '<div class="empty-hint">暂无保存的结算记录</div>';
            return;
        }
        
        historyRecords = data.records;
        
        container.innerHTML = data.records.map(r => {
            const s = r.snapshot;
            return `
                <div class="history-item" onclick="viewHistorySnapshot(${r.id})">
                    <div class="history-info">
                        <span class="history-total">¥${s.total.toFixed(2)}</span>
                        <span class="history-time">${formatTime(r.created_at)}</span>
                        ${r.note ? `<span class="history-note">${r.note}</span>` : ''}
                    </div>
                    <div class="history-arrow">→</div>
                </div>
            `;
        }).join('');
    } catch(e) {}
}

function viewHistorySnapshot(id) {
    const record = historyRecords.find(r => r.id === id);
    if (!record) { showToast('记录不存在'); return; }
    
    const s = record.snapshot;
    const cats = ['餐饮','交通','住宿','门票','购物','酒水/娱乐','其他'];
    const icons = {'餐饮':'🍽️','交通':'🚗','住宿':'🏠','门票':'🎫','购物':'🛍️','酒水/娱乐':'🍻','其他':'📌'};
    
    let catHtml = '';
    if (s.category_totals && Object.keys(s.category_totals).length > 0) {
        const total = s.total;
        catHtml = Object.entries(s.category_totals)
            .filter(([c,a]) => a > 0)
            .map(([c,a]) => {
                const pct = total > 0 ? (a / total * 100).toFixed(1) : 0;
                return `<div class="history-detail-row"><span>${icons[c]||'📌'} ${c}</span><span class="hd-amount">¥${a.toFixed(2)} (${pct}%)</span></div>`;
            }).join('');
    }
    
    let balanceHtml = '';
    if (s.balances) {
        balanceHtml = Object.values(s.balances).map(b => {
            const isPos = b.balance > 0;
            const isZero = Math.abs(b.balance) < 0.01;
            return `<div class="history-detail-row"><span>${b.name}</span><span class="hd-amount ${isZero ? '' : isPos ? 'hd-positive' : 'hd-negative'}">${isZero ? '✅ 平了' : isPos ? `应收 ¥${b.balance.toFixed(2)}` : `应付 ¥${(-b.balance).toFixed(2)}`}</span></div>`;
        }).join('');
    }
    
    let settleHtml = '';
    if (s.settlements && s.settlements.length > 0) {
        settleHtml = s.settlements.map(st => 
            `<div class="history-detail-row"><span>${st.from_name} → ${st.to_name}</span><span class="hd-amount hd-settle">¥${st.amount.toFixed(2)}</span></div>`
        ).join('');
    } else {
        settleHtml = '<div style="text-align:center;color:var(--text-secondary);padding:8px;">🎉 账目已平</div>';
    }
    
    document.getElementById('historyDetailTitle').textContent = `📋 结算记录 - ${formatTime(record.created_at)}`;
    document.getElementById('historyDetailBody').innerHTML = `
        <div class="history-detail-grid">
            <div class="history-detail-summary">
                <span>总花费</span><span class="hd-amount hd-primary">¥${s.total.toFixed(2)}</span>
                <span>人均</span><span class="hd-amount">¥${(s.per_person||0).toFixed(2)}</span>
                <span>成员</span><span class="hd-amount">${s.member_count||0}人</span>
            </div>
            ${record.note ? `<div class="history-detail-note">📌 ${record.note}</div>` : ''}
            <div class="hd-section"><h4>📊 分类统计</h4>${catHtml}</div>
            <div class="hd-section"><h4>💰 收支平衡</h4>${balanceHtml}</div>
            <div class="hd-section"><h4>🤝 结算方案</h4>${settleHtml}</div>
        </div>
    `;
    
    document.getElementById('historyDetailModal').dataset.recordId = id;
    document.getElementById('historyDetailModal').style.display = 'flex';
}

function closeHistoryDetailModal() {
    document.getElementById('historyDetailModal').style.display = 'none';
}

async function deleteHistoryRecord() {
    const id = parseInt(document.getElementById('historyDetailModal').dataset.recordId);
    if (!id || !confirm('确定删除这条结算记录？')) return;
    try {
        const res = await fetch(`/api/trip/${currentTripId}/settlement/${id}/delete`, {method: 'POST'});
        const data = await res.json();
        if (data.ok) {
            showToast('✅ 已删除');
            closeHistoryDetailModal();
            loadHistory();
        } else {
            showToast(data.error || '删除失败');
        }
    } catch(e) {
        showToast('网络错误');
    }
}

function goBack() {
    window.location = `/trip/${currentTripId}`;
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
