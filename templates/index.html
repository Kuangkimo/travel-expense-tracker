{% extends "base.html" %}
{% block title %}出游账本 - 首页{% endblock %}

{% block content %}
<div class="home-page">
    <div class="logo-area">
        <div class="logo-icon">🧾</div>
        <h1 class="app-title">出游账本</h1>
        <p class="app-desc">无感记录 · 自动算账 · 多人同步</p>
    </div>

    <!-- 用户状态 -->
    <div id="userSection" class="user-section" style="display:none;">
        <div class="user-section-info" id="userSectionInfo">
            <div class="user-avatar-wrap" id="userAvatarWrap">👤</div>
            <div>
                <div class="user-section-name" id="userSectionName">用户</div>
                <div class="user-section-status">已登录</div>
            </div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="logoutUser()">退出</button>
    </div>

    <!-- 登录/注册表单 -->
    <div id="authSection" class="auth-section">
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">登录</button>
            <button class="auth-tab" id="tabRegister" onclick="switchAuth('register')">注册</button>
        </div>
        <div id="loginForm" class="auth-form">
            <div class="form-group">
                <input type="text" id="loginUsername" placeholder="用户名" maxlength="20">
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" placeholder="密码" maxlength="50">
            </div>
            <button class="btn btn-primary btn-full" onclick="loginUser()">登录</button>
            <p class="form-hint" id="loginError" style="color:var(--danger);display:none;"></p>
        </div>
        <div id="registerForm" class="auth-form" style="display:none;">
            <div class="form-group">
                <input type="text" id="regUsername" placeholder="用户名" maxlength="20">
            </div>
            <div class="form-group">
                <input type="password" id="regPassword" placeholder="密码（至少4位）" maxlength="50">
            </div>
            <button class="btn btn-primary btn-full" onclick="registerUser()">注册</button>
            <p class="form-hint" id="regError" style="color:var(--danger);display:none;"></p>
        </div>
    </div>

    <div class="card-list">
        <div class="card card-primary" onclick="showCreateForm()">
            <div class="card-icon">✨</div>
            <div class="card-body">
                <h3>创建新行程</h3>
                <p>新建一个旅行账本，邀请好友加入</p>
            </div>
            <div class="card-arrow">→</div>
        </div>
        <div class="card" onclick="showJoinForm()">
            <div class="card-icon">🔗</div>
            <div class="card-body">
                <h3>加入已有行程</h3>
                <p>输入共享码，加入朋友的账本</p>
            </div>
            <div class="card-arrow">→</div>
        </div>
    </div>

    <!-- 创建表单 -->
    <div id="createForm" class="form-card" style="display:none;">
        <h3>✏️ 创建新行程</h3>
        <div class="form-group">
            <label>行程名称</label>
            <input type="text" id="tripName" placeholder="例如：五一广州之旅" maxlength="50">
        </div>
        <div class="form-group">
            <label>你的名字</label>
            <input type="text" id="myName" placeholder="例如：小明" maxlength="20" value="我">
        </div>
        <button class="btn btn-primary btn-full" onclick="createTrip()">创建行程</button>
        <p class="form-hint">创建后将自动生成共享码，发给同伴即可加入</p>
    </div>

    <!-- 加入表单 -->
    <div id="joinForm" class="form-card" style="display:none;">
        <h3>🔗 加入行程</h3>
        <div class="form-group">
            <label>共享码</label>
            <input type="text" id="shareCode" placeholder="6位共享码" maxlength="6" style="text-transform:uppercase; letter-spacing:4px; font-size:1.3em; text-align:center;">
        </div>
        <div class="form-group">
            <label>你的名字</label>
            <input type="text" id="joinName" placeholder="例如：小红" maxlength="20">
        </div>
        <button class="btn btn-primary btn-full" onclick="joinTrip()">加入行程</button>
    </div>

    <!-- 我的行程（登录后） -->
    <div id="myTrips" class="recent-list" style="display:none;">
        <h3>📁 我的行程</h3>
        <div id="myTripsList"></div>
    </div>

    <!-- 历史行程（未登录时） -->
    <div id="recentTrips" class="recent-list" style="display:none;">
        <h3>📋 最近行程</h3>
        <p class="form-hint" style="margin: -4px 0 12px; font-size:12px;">长按可删除记录</p>
        <div id="recentTripsList"></div>
    </div>

    <!-- 历史行程详情弹窗 -->
    <div id="historyModal" class="modal" style="display:none;">
        <div class="modal-backdrop" onclick="closeHistoryModal()"></div>
        <div class="modal-content">
            <h3 id="historyModalTitle">行程信息</h3>
            <div id="historyModalBody" class="history-modal-body">
                <div class="loading-text">加载中...</div>
            </div>
            <div class="modal-actions" style="margin-top:16px; gap:10px; flex-direction:column;">
                <button class="btn btn-primary btn-full" id="historyViewBtn" onclick="viewHistoryDetail()">📋 查看详情</button>
                <button class="btn btn-danger btn-full" onclick="deleteHistoryItem()">🗑️ 删除记录</button>
                <button class="btn btn-secondary btn-full" onclick="closeHistoryModal()">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
let historyData = null;
let historyTripId = null;

document.addEventListener('DOMContentLoaded', function() {
    checkAuth();
    renderRecentTrips();
});

// ── 登录状态 ──
function checkAuth() {
    fetch('/api/me')
        .then(r => r.json())
        .then(data => {
            if (data.ok) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('userSection').style.display = 'flex';
                const u = data.user;
                document.getElementById('userSectionName').textContent = u.nickname || u.username;
                document.getElementById('userAvatarWrap').textContent = (u.nickname || u.username)[0];
                loadMyTrips();
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('userSection').style.display = 'none';
            }
        })
        .catch(() => {});
}

function switchAuth(mode) {
    document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('regError').style.display = 'none';
}

async function loginUser() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');
    
    if (!username || !password) { err.textContent = '请输入用户名和密码'; err.style.display = 'block'; return; }
    
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.ok) {
            checkAuth();
            // 刷新导航栏
            location.reload();
        } else {
            err.textContent = data.error; err.style.display = 'block';
        }
    } catch(e) {
        err.textContent = '网络错误'; err.style.display = 'block';
    }
}

async function registerUser() {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;
    const err = document.getElementById('regError');
    
    if (!username || username.length < 2) { err.textContent = '用户名至少2个字符'; err.style.display = 'block'; return; }
    if (!password || password.length < 4) { err.textContent = '密码至少4位'; err.style.display = 'block'; return; }
    
    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.ok) {
            checkAuth();
            location.reload();
        } else {
            err.textContent = data.error; err.style.display = 'block';
        }
    } catch(e) {
        err.textContent = '网络错误'; err.style.display = 'block';
    }
}

async function logoutUser() {
    await fetch('/api/logout', {method: 'POST'});
    location.reload();
}

// ── 我的行程 ──
async function loadMyTrips() {
    try {
        const res = await fetch('/api/my/trips');
        const data = await res.json();
        if (!data.ok || !data.trips || data.trips.length === 0) {
            document.getElementById('myTrips').style.display = 'none';
            return;
        }
        document.getElementById('myTrips').style.display = 'block';
        const list = document.getElementById('myTripsList');
        list.innerHTML = data.trips.map(t => `
            <div class="recent-item" onclick="window.location='/trip/${t.id}'">
                <div class="recent-info">
                    <span class="recent-name">${t.name}</span>
                    <span class="recent-code">${t.share_code}</span>
                </div>
                <div class="recent-arrow">›</div>
            </div>
        `).join('');
    } catch(e) {
        document.getElementById('myTrips').style.display = 'none';
    }
}

// ── 最近行程（本地缓存，未登录时用） ──
function renderRecentTrips() {
    const recent = JSON.parse(sessionStorage.getItem('recentTrips') || '[]');
    if (recent.length === 0) { return; }
    document.getElementById('recentTrips').style.display = 'block';
    const list = document.getElementById('recentTripsList');
    list.innerHTML = recent.map((t, i) => `
        <div class="recent-item" onclick="openHistoryModal(${i})"
             oncontextmenu="event.preventDefault();deleteHistoryItem(${i})"
             ontouchstart="startLongPress(${i})" ontouchend="endLongPress()">
            <div class="recent-info">
                <span class="recent-name">${t.name}</span>
                <span class="recent-code">${t.code}</span>
            </div>
            <div class="recent-arrow">›</div>
        </div>
    `).join('');
}

// ── 长按检测 ──
let longPressTimer = null;
let longPressIndex = -1;

function startLongPress(index) {
    longPressIndex = index;
    longPressTimer = setTimeout(() => {
        longPressTimer = null;
        if (confirm(`删除「${JSON.parse(sessionStorage.getItem('recentTrips') || '[]')[longPressIndex]?.name || '这个'}」的行程记录？`)) {
            deleteHistoryItem(longPressIndex);
        }
    }, 500);
}

function endLongPress() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
}

// ── 历史弹窗 ──
function openHistoryModal(index) {
    const recent = JSON.parse(sessionStorage.getItem('recentTrips') || '[]');
    const trip = recent[index];
    if (!trip) return;
    historyData = trip; historyTripId = trip.id;
    document.getElementById('historyModalTitle').textContent = `📋 ${trip.name}`;
    const body = document.getElementById('historyModalBody');
    body.innerHTML = '<div class="loading-text">加载中...</div>';
    document.getElementById('historyModal').style.display = 'flex';
    fetch(`/api/trip/${trip.id}`)
        .then(r => r.json())
        .then(data => {
            if (!data.ok) { body.innerHTML = '<div class="empty-hint">无法加载详情</div>'; return; }
            const t = data.trip;
            const members = data.members || [];
            const expenses = data.expenses || [];
            const total = expenses.reduce((s, e) => s + e.amount, 0);
            body.innerHTML = `
                <div class="history-info-grid">
                    <div class="history-info-item"><span class="hi-label">共享码</span><span class="hi-value code">${t.share_code}</span></div>
                    <div class="history-info-item"><span class="hi-label">成员</span><span class="hi-value">${members.length}人 ${members.map(m => m.name).join(' · ')}</span></div>
                    <div class="history-info-item"><span class="hi-label">支出</span><span class="hi-value">${expenses.length}笔</span></div>
                    <div class="history-info-item"><span class="hi-label">总花费</span><span class="hi-value primary">¥${total.toFixed(2)}</span></div>
                    <div class="history-info-item"><span class="hi-label">创建时间</span><span class="hi-value">${t.created_at || '-'}</span></div>
                </div>`;
        })
        .catch(() => { body.innerHTML = '<div class="empty-hint">加载失败</div>'; });
}

function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
    historyData = null; historyTripId = null;
}

function viewHistoryDetail() {
    if (historyTripId) window.location = `/trip/${historyTripId}`;
}

function deleteHistoryItem(index) {
    const recent = JSON.parse(sessionStorage.getItem('recentTrips') || '[]');
    if (index === undefined) {
        if (historyTripId === null) return;
        index = recent.findIndex(t => t.id === historyTripId);
    }
    if (index === -1) return;
    recent.splice(index, 1);
    sessionStorage.setItem('recentTrips', JSON.stringify(recent));
    closeHistoryModal(); renderRecentTrips(); showToast('已删除记录');
}

// ── 创建/加入行程 ──

function showCreateForm() {
    document.getElementById('createForm').style.display = 'block';
    document.getElementById('joinForm').style.display = 'none';
    document.getElementById('tripName').focus();
}

function showJoinForm() {
    document.getElementById('joinForm').style.display = 'block';
    document.getElementById('createForm').style.display = 'none';
    document.getElementById('shareCode').focus();
}

async function createTrip() {
    const name = document.getElementById('tripName').value.trim() || '我的旅行';
    const memberName = document.getElementById('myName').value.trim() || '我';
    
    const btn = document.querySelector('#createForm .btn');
    btn.disabled = true;
    btn.textContent = '创建中...';
    
    try {
        const res = await fetch('/api/trip/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, member_name: memberName})
        });
        const data = await res.json();
        
        if (data.ok) {
            // 保存到最近行程
            const recent = JSON.parse(sessionStorage.getItem('recentTrips') || '[]');
            recent.unshift({id: data.trip_id, name, code: data.share_code});
            sessionStorage.setItem('recentTrips', JSON.stringify(recent.slice(0, 10)));
            
            window.location = `/trip/${data.trip_id}`;
        } else {
            showToast(data.error || '创建失败');
        }
    } catch(e) {
        showToast('网络错误，请重试');
    }
    
    btn.disabled = false;
    btn.textContent = '创建行程';
}

async function joinTrip() {
    const shareCode = document.getElementById('shareCode').value.trim().toUpperCase();
    const memberName = document.getElementById('joinName').value.trim() || '我';
    
    if (!shareCode) {
        showToast('请输入共享码');
        return;
    }
    
    const btn = document.querySelector('#joinForm .btn');
    btn.disabled = true;
    btn.textContent = '加入中...';
    
    try {
        const res = await fetch('/api/trip/join', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({share_code: shareCode, member_name: memberName})
        });
        const data = await res.json();
        
        if (data.ok) {
            const recent = JSON.parse(sessionStorage.getItem('recentTrips') || '[]');
            recent.unshift({id: data.trip_id, name: data.trip_name, code: shareCode});
            sessionStorage.setItem('recentTrips', JSON.stringify(recent.slice(0, 10)));
            
            window.location = `/trip/${data.trip_id}`;
        } else {
            showToast(data.error || '加入失败');
        }
    } catch(e) {
        showToast('网络错误，请重试');
    }
    
    btn.disabled = false;
    btn.textContent = '加入行程';
}
</script>
{% endblock %}
