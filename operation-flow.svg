<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="'PingFang SC','Microsoft YaHei',-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="gStart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06d6a0"/>
      <stop offset="100%" stop-color="#118ab2"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4895ef"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06d6a0"/>
      <stop offset="100%" stop-color="#2ec4b6"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#560bad"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4cc9f0"/>
    </marker>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">🧾 出游账本 · 操作流程图</text>
  <line x1="270" y1="55" x2="630" y2="55" stroke="#333" stroke-width="1"/>

  <!-- Start: Home -->
  <rect x="300" y="75" width="300" height="50" rx="25" fill="url(#gStart)" filter="url(#shadow)"/>
  <text x="450" y="105" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">🏠 首页</text>

  <!-- Branch: Create / Join -->
  <line x1="450" y1="125" x2="450" y2="155" stroke="#4cc9f0" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <polygon points="450,158 570,195 450,232 330,195" fill="#1b3a5c" stroke="#4895ef" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="192" text-anchor="middle" fill="#4895ef" font-size="13" font-weight="bold">创建还是加入？</text>

  <!-- Left: Create -->
  <line x1="330" y1="195" x2="180" y2="195" stroke="#2ec4b6" stroke-width="2"/>
  <text x="240" y="188" text-anchor="middle" fill="#2ec4b6" font-size="12">创建新行程</text>
  <rect x="60" y="245" width="230" height="55" rx="12" fill="#0a3d2e" stroke="#06d6a0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="175" y="270" text-anchor="middle" fill="#06d6a0" font-size="14" font-weight="bold">✨ 填写行程名 + 昵称</text>
  <text x="175" y="290" text-anchor="middle" fill="#88aa99" font-size="11">自动生成共享码</text>

  <!-- Right: Join -->
  <line x1="570" y1="195" x2="720" y2="195" stroke="#4895ef" stroke-width="2"/>
  <text x="660" y="188" text-anchor="middle" fill="#4895ef" font-size="12">加入已有行程</text>
  <rect x="610" y="245" width="230" height="55" rx="12" fill="#1b3a5c" stroke="#4895ef" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="725" y="270" text-anchor="middle" fill="#4895ef" font-size="14" font-weight="bold">🔗 输入6位共享码</text>
  <text x="725" y="290" text-anchor="middle" fill="#8899bb" font-size="11">加入朋友的账本</text>

  <!-- Merge to dashboard -->
  <line x1="175" y1="300" x2="175" y2="340" stroke="#2ec4b6" stroke-width="2"/>
  <line x1="175" y1="340" x2="450" y2="340" stroke="#2ec4b6" stroke-width="2"/>
  <line x1="725" y1="300" x2="725" y2="340" stroke="#4895ef" stroke-width="2"/>
  <line x1="725" y1="340" x2="450" y2="340" stroke="#4895ef" stroke-width="2"/>
  <line x1="450" y1="340" x2="450" y2="365" stroke="#4cc9f0" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <rect x="250" y="368" width="400" height="50" rx="14" fill="url(#gBlue)" filter="url(#shadow)"/>
  <text x="450" y="398" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">📋 行程面板</text>

  <line x1="450" y1="418" x2="450" y2="448" stroke="#4cc9f0" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 4 action cards -->
  <rect x="50" y="455" width="190" height="65" rx="10" fill="#0a3d2e" stroke="#06d6a0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="480" text-anchor="middle" fill="#06d6a0" font-size="14" font-weight="bold">➕ 记一笔</text>
  <text x="145" y="500" text-anchor="middle" fill="#88aa99" font-size="10">手动输入 / 截图OCR</text>

  <rect x="260" y="455" width="190" height="65" rx="10" fill="#1b3a5c" stroke="#4895ef" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="480" text-anchor="middle" fill="#4895ef" font-size="14" font-weight="bold">📋 支出列表</text>
  <text x="355" y="500" text-anchor="middle" fill="#8899bb" font-size="10">查看/筛选/编辑/删除</text>

  <rect x="470" y="455" width="190" height="65" rx="10" fill="#2d0a3d" stroke="#7209b7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="565" y="480" text-anchor="middle" fill="#7209b7" font-size="14" font-weight="bold">💰 结算</text>
  <text x="565" y="500" text-anchor="middle" fill="#9988bb" font-size="10">收支平衡 / 结算方案</text>

  <rect x="680" y="455" width="190" height="65" rx="10" fill="#3d0a1e" stroke="#e63946" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="480" text-anchor="middle" fill="#e63946" font-size="14" font-weight="bold">🔄 同步</text>
  <text x="775" y="500" text-anchor="middle" fill="#aa8899" font-size="10">导入 / 导出数据</text>

  <!-- Details section -->
  <line x1="450" y1="520" x2="450" y2="555" stroke="#4cc9f0" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <rect x="220" y="560" width="460" height="40" rx="8" fill="#1a2a3a" stroke="#333" stroke-width="1"/>
  <text x="450" y="586" text-anchor="middle" fill="#aaa" font-size="13">⬇ 各操作详情 ⬇</text>

  <line x1="145" y1="520" x2="145" y2="625" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="145" y1="625" x2="145" y2="795" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="565" y1="520" x2="565" y2="625" stroke="#7209b7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="565" y1="625" x2="565" y2="795" stroke="#7209b7" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Add expense detail -->
  <rect x="35" y="625" width="220" height="170" rx="10" fill="#0a3d2e" stroke="#06d6a0" stroke-width="1" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="145" y="650" text-anchor="middle" fill="#06d6a0" font-size="13" font-weight="bold">📝 记一笔 详情</text>
  <line x1="55" y1="660" x2="235" y2="660" stroke="#0a5a3e" stroke-width="1"/>
  <text x="65" y="680" fill="#88ccaa" font-size="11">• 选金额 + 分类 + 备注</text>
  <text x="65" y="700" fill="#88ccaa" font-size="11">• 选付款人</text>
  <text x="65" y="720" fill="#88ccaa" font-size="11">• 选分摊方式：</text>
  <text x="75" y="738" fill="#66aa88" font-size="10">  均摊 / 自己承担 / 指定人</text>
  <text x="65" y="758" fill="#88ccaa" font-size="11">• 截图OCR：上传自动识别</text>
  <text x="65" y="778" fill="#88ccaa" font-size="11">• 快捷按钮：一键记常用</text>

  <!-- Settlement detail -->
  <rect x="455" y="625" width="220" height="170" rx="10" fill="#2d0a3d" stroke="#7209b7" stroke-width="1" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="565" y="650" text-anchor="middle" fill="#7209b7" font-size="13" font-weight="bold">💰 结算 详情</text>
  <line x1="475" y1="660" x2="655" y2="660" stroke="#3d1a5c" stroke-width="1"/>
  <text x="475" y="680" fill="#aa88dd" font-size="11">• 总花费 / 人均 / 笔数</text>
  <text x="475" y="700" fill="#aa88dd" font-size="11">• 分类统计（含条形图）</text>
  <text x="475" y="720" fill="#aa88dd" font-size="11">• 收支平衡表：</text>
  <text x="485" y="738" fill="#8866bb" font-size="10">  付了 vs 应付 vs 结余</text>
  <text x="475" y="758" fill="#aa88dd" font-size="11">• 结算方案（谁给谁转多少）</text>
  <text x="475" y="778" fill="#aa88dd" font-size="11">• 保存结算记录 / 截图分享</text>

  <!-- Edit detail -->
  <line x1="355" y1="520" x2="355" y2="840" stroke="#4895ef" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="240" y="840" width="230" height="120" rx="10" fill="#1b3a5c" stroke="#4895ef" stroke-width="1" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="355" y="865" text-anchor="middle" fill="#4895ef" font-size="13" font-weight="bold">✎ 编辑/删除 详情</text>
  <line x1="260" y1="875" x2="450" y2="875" stroke="#2a5a8c" stroke-width="1"/>
  <text x="260" y="895" fill="#88bbdd" font-size="11">• 仅创建者可编辑/删除</text>
  <text x="260" y="915" fill="#88bbdd" font-size="11">• 可修改金额/分类/备注</text>
  <text x="260" y="935" fill="#88bbdd" font-size="11">• 可修改分摊方式</text>
  <text x="260" y="955" fill="#88bbdd" font-size="11">• 点击 ✎ 按钮进入编辑</text>

  <!-- Bottom -->
  <line x1="450" y1="795" x2="450" y2="830" stroke="#4cc9f0" stroke-width="2"/>
  <line x1="450" y1="830" x2="355" y2="830" stroke="#4cc9f0" stroke-width="2"/>
  <line x1="355" y1="960" x2="355" y2="990" stroke="#4895ef" stroke-width="2"/>
  <line x1="355" y1="990" x2="450" y2="990" stroke="#4895ef" stroke-width="2"/>
  <line x1="450" y1="960" x2="450" y2="990" stroke="#4cc9f0" stroke-width="2"/>
  <line x1="450" y1="990" x2="450" y2="1020" stroke="#4cc9f0" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <rect x="300" y="1025" width="300" height="50" rx="25" fill="url(#gTeal)" filter="url(#shadow)"/>
  <text x="450" y="1055" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">🏁 完成 · 账目结清</text>
</svg>